<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWhite" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1f18"/>
      <stop offset="65%" stop-color="#180f0a"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </radialGradient>
    <linearGradient id="whiteChoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="45%" stop-color="#f5edd6"/>
      <stop offset="85%" stop-color="#e3d3b2"/>
      <stop offset="100%" stop-color="#c9b691"/>
    </linearGradient>
    <linearGradient id="goldFont" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c5814"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgWhite)"/>
  
  <!-- Shadow -->
  <ellipse cx="400" cy="580" rx="210" ry="35" fill="#000000" opacity="0.65"/>

  <!-- Angled White Chocolate Bar Pieces -->
  <g transform="rotate(8, 400, 390)">
    <rect x="230" y="220" width="340" height="320" rx="14" fill="url(#whiteChoc)" stroke="#d6c49e" stroke-width="2"/>

    <!-- Quadrants with Madagascar Vanilla Bean Specks -->
    <rect x="250" y="240" width="140" height="130" rx="8" fill="#faf4e6" stroke="#c9b793" stroke-width="3"/>
    <rect x="410" y="240" width="140" height="130" rx="8" fill="#faf4e6" stroke="#c9b793" stroke-width="3"/>
    <rect x="250" y="390" width="140" height="130" rx="8" fill="#faf4e6" stroke="#c9b793" stroke-width="3"/>
    <rect x="410" y="390" width="140" height="130" rx="8" fill="#faf4e6" stroke="#c9b793" stroke-width="3"/>

    <!-- Vanilla bean specks -->
    <g fill="#382115" opacity="0.6">
      <circle cx="270" cy="260" r="1.5"/><circle cx="295" cy="275" r="1.2"/><circle cx="340" cy="255" r="1.8"/>
      <circle cx="430" cy="280" r="1.4"/><circle cx="475" cy="265" r="1.6"/><circle cx="510" cy="290" r="1.3"/>
      <circle cx="280" cy="420" r="1.5"/><circle cx="330" cy="450" r="1.2"/><circle cx="360" cy="430" r="1.7"/>
      <circle cx="440" cy="425" r="1.3"/><circle cx="490" cy="470" r="1.6"/><circle cx="520" cy="440" r="1.4"/>
    </g>

    <!-- Whole Bourbon Vanilla Orchid & Bean Silhouette accent -->
    <path d="M380,310 Q400,350 390,390" stroke="#4a2e1d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M410,315 Q400,360 415,395" stroke="#4a2e1d" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 710)" text-anchor="middle" opacity="0.85">
    <text font-family="'Playfair Display', serif" font-size="20" letter-spacing="4" fill="url(#goldFont)">CHOCOLATES SV</text>
    <text y="24" font-family="'Poppins', sans-serif" font-size="11" letter-spacing="2" fill="#d4af37" opacity="0.7">CHOCOLATE BLANCO &amp; VAINILLA BOURBON</text>
  </g>
</svg>
