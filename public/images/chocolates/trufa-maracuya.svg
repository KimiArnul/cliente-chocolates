<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1510"/>
      <stop offset="60%" stop-color="#190b08"/>
      <stop offset="100%" stop-color="#0f0504"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe58f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="passionFruit" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#b04a00"/>
    </radialGradient>
    <radialGradient id="truffleShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a251a"/>
      <stop offset="70%" stop-color="#2b120c"/>
      <stop offset="100%" stop-color="#140604"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Marble Texture Accent Lines -->
  <path d="M-50,200 Q250,150 500,280 T900,200" stroke="#d4af37" stroke-width="0.8" opacity="0.15" fill="none"/>
  <path d="M-20,600 Q300,500 550,680 T850,550" stroke="#d4af37" stroke-width="0.8" opacity="0.12" fill="none"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="590" rx="220" ry="40" fill="#000000" opacity="0.6"/>

  <!-- Slate / Marble plate -->
  <ellipse cx="400" cy="570" rx="200" ry="32" fill="#221e1d" stroke="#d4af37" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="400" cy="565" rx="190" ry="28" fill="#2d2827"/>

  <!-- Main Truffle Ball -->
  <circle cx="400" cy="400" r="140" fill="url(#truffleShadow)"/>

  <!-- Cocoa Powder Texture Particles -->
  <g opacity="0.35" fill="#5c382c">
    <circle cx="360" cy="340" r="14"/>
    <circle cx="430" cy="330" r="10"/>
    <circle cx="390" cy="380" r="18"/>
    <circle cx="450" cy="410" r="12"/>
    <circle cx="340" cy="420" r="16"/>
    <circle cx="380" cy="460" r="13"/>
    <circle cx="430" cy="470" r="11"/>
  </g>

  <!-- Luscious Passion Fruit (Maracuyá) Drizzle / Filling Reveal -->
  <path d="M340,380 C360,330 430,340 450,380 C470,420 440,460 400,480 C360,450 330,410 340,380 Z" fill="url(#passionFruit)" opacity="0.95" filter="url(#glow)"/>

  <!-- Passion Fruit Seeds and Gloss Drops -->
  <circle cx="385" cy="410" r="6" fill="#4d1a00"/>
  <circle cx="420" cy="390" r="5" fill="#4d1a00"/>
  <circle cx="400" cy="445" r="5.5" fill="#4d1a00"/>
  <ellipse cx="375" cy="370" rx="14" ry="7" fill="#ffffff" opacity="0.45" transform="rotate(-20, 375, 370)"/>

  <!-- Gold Leaf Flakes (Pan de Oro) -->
  <path d="M330,330 L342,324 L348,336 L338,342 Z" fill="url(#goldGrad)"/>
  <path d="M460,350 L472,342 L478,356 L465,362 Z" fill="url(#goldGrad)"/>
  <path d="M390,310 L402,305 L406,316 L395,320 Z" fill="url(#goldGrad)"/>
  <path d="M440,480 L450,475 L454,486 L442,490 Z" fill="url(#goldGrad)"/>

  <!-- Brand Emblem Watermark -->
  <g transform="translate(400, 710)" text-anchor="middle" opacity="0.85">
    <text font-family="'Playfair Display', serif" font-size="20" letter-spacing="4" fill="url(#goldGrad)">CHOCOLATES SV</text>
    <text y="24" font-family="'Poppins', sans-serif" font-size="11" letter-spacing="2" fill="#d4af37" opacity="0.7">TRUFA DE MARACUYÁ • EDICIÓN ARTESANAL</text>
  </g>
</svg>
