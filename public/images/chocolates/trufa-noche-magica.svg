<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgNoche" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f110e"/>
      <stop offset="70%" stop-color="#120705"/>
      <stop offset="100%" stop-color="#080201"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c5814"/>
    </linearGradient>
    <radialGradient id="truffleCore" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b1d16"/>
      <stop offset="65%" stop-color="#210e0a"/>
      <stop offset="100%" stop-color="#0c0402"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgNoche)"/>
  <ellipse cx="400" cy="590" rx="220" ry="38" fill="#000000" opacity="0.75"/>
  <ellipse cx="400" cy="570" rx="195" ry="30" fill="#201815" stroke="#d4af37" stroke-width="1.2" opacity="0.9"/>

  <!-- Left truffle -->
  <circle cx="310" cy="440" r="95" fill="url(#truffleCore)"/>
  <!-- Cocoa dust particles -->
  <circle cx="280" cy="410" r="18" fill="#4d2c22" opacity="0.4"/>
  <circle cx="340" cy="460" r="14" fill="#4d2c22" opacity="0.4"/>
  <!-- Gold flake -->
  <polygon points="305,400 315,395 320,405 310,410" fill="url(#goldAccent)"/>

  <!-- Right truffle (Main focus) -->
  <circle cx="470" cy="380" r="125" fill="url(#truffleCore)"/>
  <!-- Sea salt crystals -->
  <rect x="440" y="320" width="12" height="12" rx="2" fill="#ffffff" opacity="0.8" transform="rotate(25, 440, 320)"/>
  <rect x="490" y="340" width="9" height="9" rx="2" fill="#ffffff" opacity="0.75" transform="rotate(10, 490, 340)"/>
  <rect x="460" y="370" width="14" height="14" rx="2" fill="#ffffff" opacity="0.85" transform="rotate(40, 460, 370)"/>

  <!-- Gold leaf crown -->
  <path d="M420,310 C440,290 490,295 510,315 C520,335 490,345 470,335 Z" fill="url(#goldAccent)"/>

  <g transform="translate(400, 710)" text-anchor="middle" opacity="0.85">
    <text font-family="'Playfair Display', serif" font-size="20" letter-spacing="4" fill="url(#goldAccent)">CHOCOLATES SV</text>
    <text y="24" font-family="'Poppins', sans-serif" font-size="11" letter-spacing="2" fill="#d4af37" opacity="0.7">TRUFAS NOCHE MÁGICA 70% CACAO</text>
  </g>
</svg>
